<script>
function exShowError(msg) {
  var box = document.getElementById('ex-error');
  box.style.display = 'block';
  box.textContent = 'Something failed to load:\n\n' + msg + '\n\nMost likely cause: no internet connection when this file was opened (it loads React from a CDN), or the browser blocked the external scripts. Try again with an internet connection, or open this file in Chrome/Safari/Edge directly instead of a preview pane.';
  var loading = document.getElementById('ex-loading');
  if (loading) loading.style.display = 'none';
}
window.addEventListener('error', function(e) {
  exShowError((e && e.message) ? e.message : String(e));
});

window.storage = {
  async get(key) {
    const v = localStorage.getItem('extraction:' + key);
    if (v === null) { throw new Error('not found'); }
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem('extraction:' + key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem('extraction:' + key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const p = 'extraction:' + (prefix || '');
    const keys = Object.keys(localStorage).filter(k => k.startsWith(p)).map(k => k.slice('extraction:'.length));
    return { keys };
  }
};
</script>

function TrainerDashboard() {
  const [clients, setClients] = useState([]);
  const [programs, setPrograms] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("overview");
  const [lang, setLang] = useState("en");
  const t = DASH_T[lang];
  const rtl = RTL_LANGS.includes(lang);
  const [selectedClientId, setSelectedClientId] = useState(null);
  const [showClientForm, setShowClientForm] = useState(false);
  const [showBuilder, setShowBuilder] = useState(false);
  const [editingProgram, setEditingProgram] = useState(null);
  const [toast, setToast] = useState(null);
  const [customQuotes, setCustomQuotes] = useState([]);
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const c = await window.storage.get("clients");
        setClients(c ? JSON.parse(c.value) : []);
      } catch (e) {
        setClients([]);
      }
      try {
        const p = await window.storage.get("programs");
        const loadedPrograms = p ? JSON.parse(p.value) : [];
        setPrograms(loadedPrograms.length ? loadedPrograms : [starterExtractionProgram()]);
      } catch (e) {
        setPrograms([starterExtractionProgram()]);
      }
      try {
        const q = await window.storage.get("customQuotes");
        setCustomQuotes(q ? JSON.parse(q.value) : []);
      } catch (e) {
        setCustomQuotes([]);
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set("clients", JSON.stringify(clients));
        await window.storage.set("programs", JSON.stringify(programs));
        await window.storage.set("customQuotes", JSON.stringify(customQuotes));
      } catch (e) {
        showToast("Couldn't save — try again");
      }
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [clients, programs, customQuotes, loaded]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }

  function addClient(data) {
    setClients((prev) => [
      ...prev,
      { id: uid(), name: data.name, email: data.email, equipment: data.equipment, programId: null, phase: null, joined: new Date().toISOString().slice(0, 10) },
    ]);
    setShowClientForm(false);
    showToast("Client added");
  }

  function removeClient(id) {
    setClients((prev) => prev.filter((c) => c.id !== id));
    if (selectedClientId === id) setSelectedClientId(null);
  }

  function assignProgram(clientId, programId) {
    setClients((prev) =>
      prev.map((c) => (c.id === clientId ? { ...c, programId, phase: programId ? "Week 1" : null } : c))
    );
    showToast(programId ? "Program assigned" : "Program unassigned");
  }

  function updateClientNutrition(clientId, nutrition) {
    setClients((prev) => prev.map((c) => (c.id === clientId ? { ...c, nutrition } : c)));
  }

  function updateClientInvoices(clientId, invoices) {
    setClients((prev) => prev.map((c) => (c.id === clientId ? { ...c, invoices } : c)));
  }

  function addCustomQuote(text, author) {
    setCustomQuotes((prev) => [...prev, { id: uid(), text: text.trim(), author: author.trim() || "Unknown" }]);
    showToast("Quote added");
  }

  function removeCustomQuote(id) {
    setCustomQuotes((prev) => prev.filter((q) => q.id !== id));
  }

  function saveProgram(program) {
    setPrograms((prev) => {
      const exists = prev.some((p) => p.id === program.id);
      return exists ? prev.map((p) => (p.id === program.id ? program : p)) : [...prev, program];
    });
    setShowBuilder(false);
    setEditingProgram(null);
    showToast("Program saved");
  }

  function deleteProgram(id) {
    setPrograms((prev) => prev.filter((p) => p.id !== id));
    setClients((prev) => prev.map((c) => (c.programId === id ? { ...c, programId: null, phase: null } : c)));
    showToast("Program deleted");
  }

  function generateProgram(level, type) {
    const program = type === "hybrid" ? buildHybridProgram(level) : buildFullProgram(level);
    setPrograms((prev) => [...prev, program]);
    setView("programs");
    showToast(`Built "${program.name}"`);
  }

  const selectedClient = clients.find((c) => c.id === selectedClientId) || null;

  return (
    <div style={S.app} className="ex-app" dir={rtl ? "rtl" : "ltr"}>
      <GlobalStyle />
      <Sidebar view={view} setView={setView} clientCount={clients.length} programCount={programs.length} lang={lang} setLang={setLang} t={t} />
      <main style={S.main} className="ex-main">
        {view === "overview" && (
          <OverviewView clients={clients} programs={programs} onGoTo={setView} t={t} />
        )}
        {view === "clients" && !selectedClient && (
          <ClientsView
            clients={clients}
            programs={programs}
            onAdd={() => setShowClientForm(true)}
            onSelect={setSelectedClientId}
            onRemove={removeClient}
            t={t}
          />
        )}
        {view === "clients" && selectedClient && (
          <ClientDetail
            client={selectedClient}
            programs={programs}
            onBack={() => setSelectedClientId(null)}
            onAssign={(pid) => assignProgram(selectedClient.id, pid)}
            onPhaseChange={(phase) =>
              setClients((prev) => prev.map((c) => (c.id === selectedClient.id ? { ...c, phase } : c)))
            }
            customQuotes={customQuotes}
          />
        )}
        {view === "programs" && (
          <ProgramsView
            programs={programs}
            clients={clients}
            onNew={() => {
              setEditingProgram(null);
              setShowBuilder(true);
            }}
            onEdit={(p) => {
              setEditingProgram(p);
              setShowBuilder(true);
            }}
            onDelete={deleteProgram}
            t={t}
          />
        )}
        {view === "reference" && <ReferenceView onGenerate={generateProgram} t={t} />}
        {view === "nutrition" && <NutritionView clients={clients} onUpdate={updateClientNutrition} showToast={showToast} t={t} />}
        {view === "payments" && <PaymentsView clients={clients} onUpdate={updateClientInvoices} showToast={showToast} t={t} />}
        {view === "quotes" && <QuotesView customQuotes={customQuotes} onAdd={addCustomQuote} onRemove={removeCustomQuote} t={t} />}
      </main>

      {showClientForm && <ClientFormModal onClose={() => setShowClientForm(false)} onSave={addClient} />}
      {showBuilder && (
        <ProgramBuilderModal
          initial={editingProgram}
          onClose={() => {
            setShowBuilder(false);
            setEditingProgram(null);
          }}
          onSave={saveProgram}
        />
      )}
      {toast && (
        <div style={S.toast} role="status" aria-live="polite">
          {toast}
        </div>
      )}
    </div>
  );
}

function buildFullProgram(level) {
  const find = (pattern) => MOVEMENT_PATTERNS.find((p) => p.pattern === pattern).options[level];
  const day = (label, rows) => ({
    id: uid(),
    label,
    exercises: rows.map(([name, sets, reps, notes]) => ({ id: uid(), name, sets, reps, notes: notes || "" })),
  });
  const week = (label, days) => ({ id: uid(), label, days });

  const weeks = WEEK_SCHEME.map((w, i) => {
    if (w.retest) {
      const steadyState = CONDITIONING_TYPES["Steady state"][level];
      return week(`Week ${i + 1} — RTB (retest)`, [
        day("Day 1 — Retest lower + core", [
          [find("Squat"), "1", "heaviest set of 5", "Compare load directly against Week 1"],
          [find("Hinge"), "1", "heaviest set of 5", ""],
          [find("Core / anti-extension"), "1", "max hold/reps", ""],
        ]),
        day("Day 2 — Retest upper", [
          [find("Horizontal push"), "1", "heaviest set of 5", "Compare load directly against Week 1"],
          [find("Horizontal pull"), "1", "heaviest set of 5", ""],
          [find("Vertical pull"), "1", "max", "Compare rep count against Week 1"],
        ]),
        day("Day 3 — Retest conditioning", [
          [steadyState, "1", "15 min continuous", "Retest — compare pace/output directly against Week 1's 15-minute piece"],
          [find("Loaded carry"), "1", "max distance in 60s", "RTB Debrief: log bodyweight, waist, and how the block felt overall"],
        ]),
      ]);
    }
    const [ms, mr] = w.main;
    const [as, ar] = w.acc;
    const condName = CONDITIONING_TYPES[w.cond.type][level];
    return week(`Week ${i + 1} — ${w.phase}`, [
      day("Day 1 — Lower + core", [
        [find("Squat"), ms, mr, w.note],
        [find("Hinge"), ms, mr, ""],
        [find("Loaded carry"), w.carrySets, w.carryDist, ""],
        [find("Core / anti-extension"), as, ar === "5" ? "10" : "12", ""],
      ]),
      day("Day 2 — Upper push/pull", [
        [find("Horizontal push"), ms, mr, ""],
        [find("Horizontal pull"), ms, mr, ""],
        [find("Vertical push"), as, ar, ""],
        [find("Vertical pull"), as, "max", "Log actual reps achieved"],
        [find("Rotational / shoulder flow"), "2", "8/side", "Shoulder health and rotational control — light, controlled tempo"],
      ]),
      day(`Day 3 — Conditioning (${w.cond.type}) + carry`, [
        [find("Loaded carry"), w.carrySets, w.carryDist, "Heaviest/hardest carry of the week"],
        [condName, w.cond.sets, w.cond.reps, w.cond.notes],
        [find("Core / anti-extension"), "3", `${w.coreDur}s`, w.phase === "STABILIZE" && i === 6 ? "SITREP: log bodyweight, waist, recovery" : ""],
      ]),
    ]);
  });

  return {
    id: uid(),
    name: `The Extraction Protocol — ${level}`,
    description: `Full 90-day, 4-phase block (LOCATE → STABILIZE → GOLDEN HOUR → RTB) built entirely around ${level.toLowerCase()}.`,
    weeks,
  };
}

/* ---------- Nutrition tracking ---------- */
const ACTIVITY_MULT = {
  sedentary: 1.2,
  light: 1.375,
  moderate: 1.55,
  active: 1.725,
  "very active": 1.9,
};
const GOAL_ADJUST = { cut: -0.2, maintain: 0, bulk: 0.1 };

function computeMacros({ sex, age, heightCm, weightKg, activity, goal }) {
  const a = parseFloat(age) || 0;
  const h = parseFloat(heightCm) || 0;
  const w = parseFloat(weightKg) || 0;
  if (!a || !h || !w) return null;
  const bmr = sex === "female" ? 10 * w + 6.25 * h - 5 * a - 161 : 10 * w + 6.25 * h - 5 * a + 5;
  const tdee = bmr * (ACTIVITY_MULT[activity] || 1.375);
  const calories = Math.round(tdee * (1 + (GOAL_ADJUST[goal] || 0)));
  const protein = Math.round(w * 1.8);
  const fat = Math.round((calories * 0.25) / 9);
  const carbs = Math.max(0, Math.round((calories - protein * 4 - fat * 9) / 4));
  return { calories, protein, carbs, fat };
}

/* ---------- 14-day carb cycling ---------- */
const CARB_CYCLE_PATTERN = ["High", "Low", "Medium", "Low", "High", "Low", "Medium"]; // repeats twice = 14 days
const CARB_CYCLE_MULT = {
  High: { calories: 1.1, carbs: 1.35 },
  Medium: { calories: 1.0, carbs: 1.0 },
  Low: { calories: 0.9, carbs: 0.55 },
};

function buildDayMacros(baseline, type) {
  const mult = CARB_CYCLE_MULT[type];
  const dayCalories = Math.round(baseline.calories * mult.calories);
  const protein = baseline.protein; // held constant across every day
  const carbs = Math.max(0, Math.round(baseline.carbs * mult.carbs));
  const fat = Math.max(20, Math.round((dayCalories - protein * 4 - carbs * 4) / 9));
  return { calories: dayCalories, protein, carbs, fat };
}

function buildCarbCycle(baseline) {
  const days = [];
  for (let i = 0; i < 14; i++) {
    const type = CARB_CYCLE_PATTERN[i % 7];
    days.push({ day: i + 1, type, ...buildDayMacros(baseline, type) });
  }
  return { baseline, days, generatedAt: new Date().toISOString() };
}

/* Evaluate the most recent check-ins against the goal and recommend a calorie adjustment */
function evaluateCheckins(checkins, goal) {
  if (!checkins || checkins.length < 2) {
    return { canEvaluate: false, message: "Need at least 2 check-ins to evaluate a trend." };
  }
  // checkins are stored newest-first
  const sorted = [...checkins].sort((a, b) => (a.date < b.date ? -1 : 1));
  const recent = sorted.slice(-3); // up to last 3 check-ins
  const first = parseFloat(recent[0].weight);
  const last = parseFloat(recent[recent.length - 1].weight);
  if (isNaN(first) || isNaN(last)) {
    return { canEvaluate: false, message: "Check-in weights aren't readable — log weight as a number." };
  }
  const delta = last - first; // kg change across the window
  const avgAdherence = recent.reduce((s, c) => s + (parseFloat(c.adherence) || 0), 0) / recent.length;

  const lowAdherence = avgAdherence < 70;

  if (lowAdherence) {
    return {
      canEvaluate: true,
      adjustmentPct: 0,
      message: `Adherence has averaged ${Math.round(avgAdherence)}% over the last ${recent.length} check-ins — that's the limiter, not the macros. Hold the current plan and fix consistency before adjusting numbers.`,
    };
  }

  if (goal === "cut") {
    if (delta <= -0.2) return { canEvaluate: true, adjustmentPct: 0, message: `Weight down ${Math.abs(delta).toFixed(1)}kg over the last ${recent.length} check-ins — on track. Keep the current plan.` };
    if (delta > 0.15) return { canEvaluate: true, adjustmentPct: -10, message: `Weight is trending up ${delta.toFixed(1)}kg on a cut — pulling calories down ~10%.` };
    return { canEvaluate: true, adjustmentPct: -7, message: `Weight has plateaued (${delta.toFixed(1)}kg over ${recent.length} check-ins) despite good adherence — reducing calories ~7% to restart progress.` };
  }
  if (goal === "bulk") {
    if (delta >= 0.2) return { canEvaluate: true, adjustmentPct: 0, message: `Weight up ${delta.toFixed(1)}kg over the last ${recent.length} check-ins — on track. Keep the current plan.` };
    if (delta < -0.15) return { canEvaluate: true, adjustmentPct: 10, message: `Weight is trending down ${Math.abs(delta).toFixed(1)}kg on a bulk — pushing calories up ~10%.` };
    return { canEvaluate: true, adjustmentPct: 7, message: `Weight has plateaued (${delta.toFixed(1)}kg over ${recent.length} check-ins) despite good adherence — increasing calories ~7% to restart progress.` };
  }
  // maintain
  if (Math.abs(delta) <= 0.5) return { canEvaluate: true, adjustmentPct: 0, message: `Weight stable (${delta.toFixed(1)}kg over ${recent.length} check-ins) — plan is holding maintenance correctly.` };
  const dir = delta > 0 ? -5 : 5;
  return { canEvaluate: true, adjustmentPct: dir, message: `Weight has drifted ${delta.toFixed(1)}kg on a maintenance plan — adjusting calories ${dir > 0 ? "up" : "down"} ~${Math.abs(dir)}% to re-center.` };
}

function applyAdjustment(baseline, pct) {
  const newCalories = Math.round(baseline.calories * (1 + pct / 100));
  const protein = baseline.protein; // never cut protein
  const remaining = newCalories - protein * 4;
  const originalNonProtein = baseline.carbs * 4 + baseline.fat * 9;
  const scale = originalNonProtein > 0 ? remaining / originalNonProtein : 1;
  const carbs = Math.max(0, Math.round(baseline.carbs * scale));
  const fat = Math.max(20, Math.round(baseline.fat * scale));
  return { calories: newCalories, protein, carbs, fat };
}

/* ---------- cardio prescription: goal + equipment -> specific session plan ---------- */
const CARDIO_MACHINE_BY_EQUIPMENT = {
  "Full gym": { hiit: "Assault bike or rowing machine", steady: "Incline treadmill walk or elliptical" },
  "Dumbbells, kettlebells + functional tools": { hiit: "KB swing or sandbag carry intervals", steady: "Weighted ruck walk or steady-pace KB swings" },
  "Bodyweight only": { hiit: "Sprint or shuttle-run intervals", steady: "Easy jog or brisk walk" },
  "Bands only": { hiit: "Band-resisted step-up intervals", steady: "Brisk walk" },
};

const CARDIO_PLAN_BY_GOAL = {
  cut: [
    { type: "HIIT", duration: "15–20 min", frequency: "3x/week", key: "hiit", note: "Push genuinely hard on work intervals — this is the main calorie-burn driver on a cut" },
    { type: "Steady state", duration: "30–40 min", frequency: "2x/week", key: "steady", note: "Conversational pace — adds extra burn without eating into recovery" },
  ],
  maintain: [
    { type: "Steady state", duration: "20–30 min", frequency: "3x/week", key: "steady", note: "Keep the engine running without adding fatigue that competes with strength work" },
  ],
  bulk: [
    { type: "Steady state (easy)", duration: "15–20 min", frequency: "2x/week", key: "steady", note: "Just enough to protect cardiovascular health — short and easy so it doesn't compete with the calorie surplus" },
  ],
};

function computeCardioPrescription(goal, equipment) {
  const plan = CARDIO_PLAN_BY_GOAL[goal] || CARDIO_PLAN_BY_GOAL.maintain;
  const machines = CARDIO_MACHINE_BY_EQUIPMENT[equipment] || CARDIO_MACHINE_BY_EQUIPMENT["Bodyweight only"];
  return plan.map((p) => ({ ...p, machine: machines[p.key] }));
}

    const next = { ...stats, override: null };
    setStats(next);
    onSave(next);

    const base = stats.override || computed || { calories: 0, protein: 0, carbs: 0, fat: 0 };

    onSave(next);

        <Row2>

function PaymentsView({ clients, onUpdate, showToast, t }) {
  const [draft, setDraft] = useState({ clientId: clients[0]?.id || "", description: "", amount: "", currency: "KWD", dueDate: "", status: "pending" });
  const [selectedInvoice, setSelectedInvoice] = useState(null);

  const allInvoices = clients.flatMap((c) => (c.invoices || []).map((inv) => ({ ...inv, clientId: c.id, clientName: c.name, clientEmail: c.email })));
  const sorted = [...allInvoices].sort((a, b) => (a.dueDate < b.dueDate ? -1 : 1));

  if (selectedInvoice) {
    return <InvoiceDocument invoice={selectedInvoice} onBack={() => setSelectedInvoice(null)} />;
  }

  const totals = {};
  for (const cur of CURRENCIES) totals[cur] = { paid: 0, pending: 0, overdue: 0 };
  for (const inv of allInvoices) {
    const cur = totals[inv.currency] ? inv.currency : "USD";
    totals[cur][inv.status] = (totals[cur][inv.status] || 0) + (parseFloat(inv.amount) || 0);
  }

  function addInvoice() {
    if (!draft.clientId || !draft.description.trim() || !draft.amount) {
      showToast("Fill in client, description, and amount first");
      return;
    }
    const client = clients.find((c) => c.id === draft.clientId);
    const newInvoice = { id: uid(), description: draft.description.trim(), amount: draft.amount, currency: draft.currency, dueDate: draft.dueDate, status: draft.status, createdAt: new Date().toISOString().slice(0, 10) };
    onUpdate(draft.clientId, [...(client.invoices || []), newInvoice]);
    setDraft({ clientId: draft.clientId, description: "", amount: "", currency: draft.currency, dueDate: "", status: "pending" });
    showToast("Invoice added");
  }

  function setInvoiceStatus(clientId, invoiceId, status) {
    const client = clients.find((c) => c.id === clientId);
    onUpdate(clientId, (client.invoices || []).map((inv) => (inv.id === invoiceId ? { ...inv, status } : inv)));
  }

  function removeInvoice(clientId, invoiceId) {
    const client = clients.find((c) => c.id === clientId);
    onUpdate(clientId, (client.invoices || []).filter((inv) => inv.id !== invoiceId));
  }

  return (
    <div>
      <div style={S.headerRow}>
        <div>
          <h1 style={S.h1}>{t.payments_title}</h1>
          <p style={S.sub}>{t.payments_sub}</p>
        </div>
      </div>

      <div style={S.grid}>
        {CURRENCIES.map((cur) => (
          <div key={cur} style={S.macroCell}>
            <div style={S.macroLabel}>{cur} collected</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: T.color.bone }}>{totals[cur].paid.toFixed(2)}</div>
            <div style={S.macroUnit}>
              {totals[cur].pending.toFixed(2)} pending · {totals[cur].overdue.toFixed(2)} overdue
            </div>
          </div>
        ))}
      </div>

      {clients.length === 0 ? (
        <EmptyState title={t.clients_empty_title} body={t.clients_empty_body} />
      ) : (
        <>
          <div style={{ ...S.card, marginTop: 18 }}>
            <div style={S.cardLabel}>New invoice</div>
            <Row2>
              <Field2 label="Client">
                <select style={S.select} value={draft.clientId} onChange={(e) => setDraft((d) => ({ ...d, clientId: e.target.value }))}>
                  {clients.map((c) => (
                    <option key={c.id} value={c.id}>{c.name}</option>
                  ))}
                </select>
              </Field2>
              <Field2 label="Currency">
                <select style={S.select} value={draft.currency} onChange={(e) => setDraft((d) => ({ ...d, currency: e.target.value }))}>
                  {CURRENCIES.map((c) => (
                    <option key={c} value={c}>{c}</option>
                  ))}
                </select>
              </Field2>
            </Row2>
            <Field2 label="Description">
              <input style={S.input} value={draft.description} onChange={(e) => setDraft((d) => ({ ...d, description: e.target.value }))} placeholder="e.g. Extraction Protocol — Month 1" />
            </Field2>
            <Row2>
              <Field2 label="Amount">
                <input style={S.input} value={draft.amount} onChange={(e) => setDraft((d) => ({ ...d, amount: e.target.value.replace(/[^0-9.]/g, "") }))} placeholder="0.00" />
              </Field2>
              <Field2 label="Due date">
                <input type="date" style={S.select} value={draft.dueDate} onChange={(e) => setDraft((d) => ({ ...d, dueDate: e.target.value }))} />
              </Field2>
            </Row2>
            <button className="ex-btn-primary" style={{ ...S.btnPrimary, marginTop: 4 }} onClick={addInvoice}>
              Add invoice
            </button>
          </div>

          <div style={{ ...S.card, marginTop: 14 }}>
            <div style={S.cardLabel}>All invoices</div>
            {sorted.length === 0 ? (
              <p style={{ ...S.rowSub, margin: 0 }}>No invoices logged yet.</p>
            ) : (
              <table style={S.table} className="ex-table">
                <thead>
                  <tr>
                    <td style={{ ...S.td, ...S.tdMuted }}>Client</td>
                    <td style={S.td}>Description</td>
                    <td style={{ ...S.td, ...S.tdRight }}>Amount</td>
                    <td style={{ ...S.td, ...S.tdMuted }}>Due</td>
                    <td style={S.td}>Status</td>
                    <td style={S.td}></td>
                    <td style={S.td}></td>
                  </tr>
                </thead>
                <tbody>
                  {sorted.map((inv) => (
                    <tr key={inv.id}>
                      <td style={S.td}>{inv.clientName}</td>
                      <td style={{ ...S.td, ...S.tdMuted }}>{inv.description}</td>
                      <td style={{ ...S.td, ...S.tdRight }}>{parseFloat(inv.amount).toFixed(2)} {inv.currency}</td>
                      <td style={{ ...S.td, ...S.tdMuted }}>{inv.dueDate || "—"}</td>
                      <td style={S.td}>
                        <select
                          style={{ ...S.select, padding: "4px 8px", fontSize: 12 }}
                          value={inv.status}
                          onChange={(e) => setInvoiceStatus(inv.clientId, inv.id, e.target.value)}
                        >
                          {INVOICE_STATUSES.map((s) => (
                            <option key={s} value={s}>{s}</option>
                          ))}
                        </select>
                      </td>
                      <td style={S.td}>
                        <button className="ex-link" style={S.linkAdd} onClick={() => setSelectedInvoice(inv)}>View / print</button>
                      </td>
                      <td style={S.td}>
                        <button className="ex-icon" style={S.iconBtnSmall} onClick={() => removeInvoice(inv.clientId, inv.id)} aria-label="Remove invoice">✕</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </>
      )}
    </div>
  );
}

/* ---------- Overview (home) ---------- */
function OverviewView({ clients, programs, onGoTo, t }) {
  const activeClients = clients.filter((c) => c.programId).length;
  const unassigned = clients.length - activeClients;

  const allInvoices = clients.flatMap((c) => (c.invoices || []).map((inv) => ({ ...inv, clientName: c.name })));
  const paidTotals = {};
  const pendingTotals = {};
  for (const inv of allInvoices) {
    const cur = CURRENCIES.includes(inv.currency) ? inv.currency : "USD";
    if (inv.status === "paid") paidTotals[cur] = (paidTotals[cur] || 0) + (parseFloat(inv.amount) || 0);
    else pendingTotals[cur] = (pendingTotals[cur] || 0) + (parseFloat(inv.amount) || 0);
  }
  const upcoming = allInvoices
    .filter((inv) => inv.status !== "paid" && inv.dueDate)
    .sort((a, b) => (a.dueDate < b.dueDate ? -1 : 1))
    .slice(0, 5);

  const recentClients = [...clients].reverse().slice(0, 5);

  return (
    <div>
      <div style={S.headerRow}>
        <div>
          <h1 style={S.h1}>{t.overview_title}</h1>
          <p style={S.sub}>{t.overview_sub}</p>
        </div>
      </div>

      <div style={S.grid}>
        <StatCard label={t.stat_clients} value={clients.length} sub={`${activeClients} ${t.assigned} · ${unassigned} ${t.unassigned}`} onClick={() => onGoTo("clients")} />
        <StatCard label={t.stat_programs} value={programs.length} sub={t.stat_programs_sub} onClick={() => onGoTo("programs")} />
        <StatCard
          label={t.stat_collected}
          value={Object.entries(paidTotals).map(([cur, v]) => `${v.toFixed(0)} ${cur}`).join(" · ") || "0"}
          sub={t.stat_collected_sub}
          onClick={() => onGoTo("payments")}
        />
        <StatCard
          label={t.stat_outstanding}
          value={Object.entries(pendingTotals).map(([cur, v]) => `${v.toFixed(0)} ${cur}`).join(" · ") || "0"}
          sub={t.stat_outstanding_sub}
          onClick={() => onGoTo("payments")}
        />
      </div>

      <div style={{ display: "flex", gap: 14, marginTop: 18, flexWrap: "wrap" }}>
        <div style={{ ...S.card, flex: 1, minWidth: 260 }}>
          <div style={S.cardLabel}>{t.recent_clients}</div>
          {recentClients.length === 0 ? (
            <p style={{ ...S.rowSub, margin: 0 }}>{t.recent_clients_empty}</p>
          ) : (
            recentClients.map((c) => (
              <div key={c.id} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid ${T.color.border}` }}>
                <span style={{ fontSize: 13, color: T.color.bone }}>{c.name}</span>
                <span style={{ fontSize: 12, color: T.color.textMuted }}>{c.programId ? t.assigned : t.unassigned}</span>
              </div>
            ))
          )}
        </div>

        <div style={{ ...S.card, flex: 1, minWidth: 260 }}>
          <div style={S.cardLabel}>{t.upcoming_payments}</div>
          {upcoming.length === 0 ? (
            <p style={{ ...S.rowSub, margin: 0 }}>{t.upcoming_payments_empty}</p>
          ) : (
            upcoming.map((inv) => (
              <div key={inv.id} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid ${T.color.border}` }}>
                <span style={{ fontSize: 13, color: T.color.bone }}>{inv.clientName}</span>
                <span style={{ fontSize: 12, color: inv.status === "overdue" ? T.color.danger : T.color.textMuted }}>
                  {inv.dueDate} · {parseFloat(inv.amount).toFixed(0)} {inv.currency}
                </span>
              </div>
            ))
          )}
        </div>
      </div>
    </div>
  );
}

function getDailyQuote(dayIndex, pool) {
  const list = pool && pool.length ? pool : DAILY_QUOTES;
  return list[dayIndex % list.length];
}

function DailyIntro({ dayNumber, customQuotes }) {
  const pool = [...DAILY_QUOTES, ...(customQuotes || [])];
  const q = getDailyQuote(dayNumber - 1, pool);
  return (
    <div style={S.dailyIntro}>
      <img src={LOGO_SRC} alt="Extraction" style={S.dailyIntroLogo} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={S.dailyIntroDay}>Day {dayNumber}</div>
        <div style={S.dailyIntroQuote}>"{q.text}"</div>
        <div style={S.dailyIntroAuthor}>— {q.author}</div>
      </div>
    </div>
  );
}

  );

/* ---------- Program builder modal ---------- */
function ProgramBuilderModal({ initial, onClose, onSave }) {
  const [name, setName] = useState(initial?.name || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [weeks, setWeeks] = useState(initial?.weeks || [emptyWeek(1)]);
  const [error, setError] = useState("");

  function addWeek() {
    setWeeks((w) => [...w, emptyWeek(w.length + 1)]);
  }
  function removeWeek(id) {
    setWeeks((w) => w.filter((x) => x.id !== id));
  }
  function addDay(weekId) {
    setWeeks((w) => w.map((wk) => (wk.id === weekId ? { ...wk, days: [...wk.days, emptyDay(`Day ${wk.days.length + 1}`)] } : wk)));
  }
  function removeDay(weekId, dayId) {
    setWeeks((w) => w.map((wk) => (wk.id === weekId ? { ...wk, days: wk.days.filter((d) => d.id !== dayId) } : wk)));
  }
  function updateDayLabel(weekId, dayId, label) {
    setWeeks((w) => w.map((wk) => (wk.id === weekId ? { ...wk, days: wk.days.map((d) => (d.id === dayId ? { ...d, label } : d)) } : wk)));
  }
  function addExercise(weekId, dayId) {
    setWeeks((w) =>
      w.map((wk) =>
        wk.id === weekId ? { ...wk, days: wk.days.map((d) => (d.id === dayId ? { ...d, exercises: [...d.exercises, emptyExercise()] } : d)) } : wk
      )
    );
  }
  function removeExercise(weekId, dayId, exId) {
    setWeeks((w) =>
      w.map((wk) =>
        wk.id === weekId
          ? { ...wk, days: wk.days.map((d) => (d.id === dayId ? { ...d, exercises: d.exercises.filter((e) => e.id !== exId) } : d)) }
          : wk
      )
    );
  }
  function updateExercise(weekId, dayId, exId, field, value) {
    setWeeks((w) =>
      w.map((wk) =>
        wk.id === weekId
          ? {
              ...wk,
              days: wk.days.map((d) =>
                d.id === dayId ? { ...d, exercises: d.exercises.map((e) => (e.id === exId ? { ...e, [field]: value } : e)) } : d
              ),
            }
          : wk
      )
    );
  }

  function submit() {
    if (!name.trim()) {
      setError("Enter a program name first");
      return;
    }
    onSave({ id: initial?.id || uid(), name: name.trim(), description: description.trim(), weeks });
  }

  return (
    <Modal onClose={onClose} title={initial ? "Edit program" : "New program"} wide>
      <label style={S.label}>Program name</label>
      <input
        style={S.input}
        value={name}
        onChange={(e) => {
          setName(e.target.value);
          if (error) setError("");
        }}
        placeholder="e.g. The Extraction Protocol"
        autoFocus
      />
      {error && <div style={S.error}>{error}</div>}
      <label style={S.label}>Description (optional)</label>
      <input style={S.input} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="One line about this program" />

      <div style={{ marginTop: 18 }}>
        {weeks.map((wk) => (
          <div key={wk.id} style={S.weekEditor}>
            <div style={S.weekEditorHeader}>
              <span style={S.weekEditorLabel}>{wk.label}</span>
              {weeks.length > 1 && (
                <button className="ex-link" style={S.linkDanger} onClick={() => removeWeek(wk.id)}>Remove week</button>
              )}
            </div>
            {wk.days.map((d) => (
              <div key={d.id} style={S.dayEditor}>
                <div style={S.dayEditorHeader}>
                  <input style={S.dayLabelInput} value={d.label} onChange={(e) => updateDayLabel(wk.id, d.id, e.target.value)} />
                  {wk.days.length > 1 && (
                    <button className="ex-link" style={S.linkDanger} onClick={() => removeDay(wk.id, d.id)}>Remove day</button>
                  )}
                </div>
                {d.exercises.map((ex) => (
                  <div key={ex.id} style={S.exerciseRow}>
                    <input
                      style={{ ...S.exInput, flex: 2 }}
                      placeholder="Exercise"
                      value={ex.name}
                      onChange={(e) => updateExercise(wk.id, d.id, ex.id, "name", e.target.value)}
                    />
                    <input
                      style={{ ...S.exInput, width: 46 }}
                      placeholder="sets"
                      value={ex.sets}
                      onChange={(e) => updateExercise(wk.id, d.id, ex.id, "sets", e.target.value)}
                    />
                    <span style={S.exX}>×</span>
                    <input
                      style={{ ...S.exInput, width: 56 }}
                      placeholder="reps"
                      value={ex.reps}
                      onChange={(e) => updateExercise(wk.id, d.id, ex.id, "reps", e.target.value)}
                    />
                    <input
                      style={{ ...S.exInput, flex: 1 }}
                      placeholder="notes"
                      value={ex.notes}
                      onChange={(e) => updateExercise(wk.id, d.id, ex.id, "notes", e.target.value)}
                    />
                    {ex.name && (
                      <a href={ytSearchUrl(ex.name)} target="_blank" rel="noopener noreferrer" style={S.iconBtnSmall} aria-label={`Watch form video for ${ex.name}`}>
                        ▶
                      </a>
                    )}
                    <button className="ex-icon" style={S.iconBtnSmall} onClick={() => removeExercise(wk.id, d.id, ex.id)} aria-label="Remove exercise">✕</button>
                  </div>
                ))}
                <button className="ex-link" style={S.linkAdd} onClick={() => addExercise(wk.id, d.id)}>+ Add exercise</button>
              </div>
            ))}
            <button className="ex-link" style={S.linkAdd} onClick={() => addDay(wk.id)}>+ Add day</button>
          </div>
        ))}
        <button className="ex-btn-ghost" style={S.btnGhost} onClick={addWeek}>+ Add week</button>
      </div>

      <div style={S.modalActions}>
        <button className="ex-btn-ghost" style={S.btnGhost} onClick={onClose}>Cancel</button>
        <button className="ex-btn-primary" style={S.btnPrimary} onClick={submit}>Save program</button>
      </div>
    </Modal>
  );
}

/* ---------- shared ---------- */
function Modal({ title, children, onClose, wide }) {
  useEffect(() => {
    function onKey(e) {
      if (e.key === "Escape") onClose();
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  return (
    <div style={S.overlay} onClick={onClose}>
      <div
        style={{ ...S.modal, maxWidth: wide ? 640 : 420 }}
        onClick={(e) => e.stopPropagation()}
        role="dialog"
        aria-modal="true"
        aria-label={title}
      >
        <div style={S.modalHeader}>
          <span style={S.modalTitle}>{title}</span>
          <button className="ex-icon" style={S.iconBtn} onClick={onClose} aria-label="Close">✕</button>
        </div>
        <div style={S.modalBody}>{children}</div>
      </div>
    </div>
  );
}

function EmptyState({ title, body }) {
  return (
    <div style={S.empty}>
      <div style={S.emptyTitle}>{title}</div>
      <div style={S.emptyBody}>{body}</div>
    </div>
  );
}
