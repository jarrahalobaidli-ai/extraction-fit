<script>
function exShowError(msg) {
  var box = document.getElementById('ex-error');
  box.style.display = 'block';
  box.textContent = 'Something failed to load:\n\n' + msg + '\n\nMost likely cause: no internet connection when this file was opened (it loads React from a CDN), or the browser blocked the external scripts. Try again with an internet connection, or open this file in Chrome/Safari/Edge directly instead of a preview pane.';
  var loading = document.getElementById('ex-loading');
  if (loading) loading.style.display = 'none';
}
window.addEventListener('error', function(e) {
  exShowError((e && e.message) ? e.message : String(e));
});

window.storage = {
  async get(key) {
    const v = localStorage.getItem('extraction:' + key);
    if (v === null) { throw new Error('not found'); }
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem('extraction:' + key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem('extraction:' + key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const p = 'extraction:' + (prefix || '');
    const keys = Object.keys(localStorage).filter(k => k.startsWith(p)).map(k => k.slice('extraction:'.length));
    return { keys };
  }
};
</script>

function ExtractionIntake() {
  const [lang, setLang] = useState("en");
  const [mode, setMode] = useState("form"); // "form" | "confirmed" | "coach"
  const [step, setStep] = useState(0);
  const [form, setForm] = useState(emptyForm());
  const [errors, setErrors] = useState({});
  const [submissions, setSubmissions] = useState([]);
  const [loadingSubs, setLoadingSubs] = useState(false);
  const t = TR8N[lang];
  const rtl = RTL_LANGS.includes(lang);
  const STEPS = [t.step_contact, t.step_physical, t.step_mental, t.step_purpose, t.step_commitment, t.step_review];

  function set(field, value) {
    setForm((f) => ({ ...f, [field]: value }));
    if (errors[field]) setErrors((e) => ({ ...e, [field]: null }));
  }

  function validateStep(i) {
    const e = {};
    if (i === 0) {
      if (!form.name.trim()) e.name = true;
      if (!form.email.trim()) e.email = true;
    }
    if (i === 1) {
      if (!form.medicalClearance) e.medicalClearance = true;
    }
    if (i === 2) {
      if (!form.whyNow.trim()) e.whyNow = true;
    }
    if (i === 3) {
      if (!form.becoming.trim()) e.becoming = true;
    }
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function next() {
    if (!validateStep(step)) return;
    setStep((s) => Math.min(s + 1, STEPS.length - 1));
  }
  function back() {
    setStep((s) => Math.max(s - 1, 0));
  }

  async function submit() {
    if (!validateStep(0) || !validateStep(1) || !validateStep(2) || !validateStep(3)) {
      setStep(0);
      return;
    }
    const record = {
      id: uid(),
      submittedAt: new Date().toISOString(),
      ...form,
    };
    try {
      await window.storage.set(`mayday:${record.submittedAt}-${record.id}`, JSON.stringify(record), true);
    } catch (err) {
      // still show confirmation locally even if the save failed
    }
    setMode("confirmed");
  }

  async function loadSubmissions() {
    setLoadingSubs(true);
    try {
      const list = await window.storage.list("mayday:", true);
      const keys = list && list.keys ? list.keys : [];
      const results = [];
      for (const k of keys) {
        try {
          const r = await window.storage.get(k, true);
          if (r) results.push(JSON.parse(r.value));
        } catch (e) {
          // skip unreadable entry
        }
      }
      results.sort((a, b) => (a.submittedAt < b.submittedAt ? 1 : -1));
      setSubmissions(results);
    } catch (e) {
      setSubmissions([]);
    }
    setLoadingSubs(false);
  }

  useEffect(() => {
    if (mode === "coach") loadSubmissions();
  }, [mode]);

  const commonProps = { lang, setLang, t, rtl };

  if (mode === "confirmed")
    return <Confirmed {...commonProps} form={form} onRestart={() => { setForm(emptyForm()); setStep(0); setMode("form"); }} />;
  if (mode === "coach")
    return <CoachView {...commonProps} submissions={submissions} loading={loadingSubs} onBack={() => setMode("form")} onRefresh={loadSubmissions} />;

  return (
    <div style={S.app} dir={rtl ? "rtl" : "ltr"}>
      <Header {...commonProps} />
      <div style={S.progressRow} className="ex-progress-row">
        {STEPS.map((s, i) => (
          <div key={s} style={S.progressItem}>
            <div style={{ ...S.progressDot, ...(i <= step ? S.progressDotActive : {}) }}>{i + 1}</div>
            <span className="ex-progress-label" style={{ ...S.progressLabel, color: i <= step ? T.color.bone : T.color.textMuted }}>{s}</span>
          </div>
        ))}
      </div>

      <div style={S.card}>
        {step === 0 && <StepContact t={t} form={form} set={set} errors={errors} />}
        {step === 1 && <StepPhysical t={t} form={form} set={set} errors={errors} />}
        {step === 2 && <StepMental t={t} form={form} set={set} errors={errors} />}
        {step === 3 && <StepPurpose t={t} form={form} set={set} errors={errors} />}
        {step === 4 && <StepCommitment t={t} form={form} set={set} />}
        {step === 5 && <StepReview t={t} form={form} />}
      </div>

      <div style={S.navRow}>
        <button className="ex-btn-ghost" style={S.btnGhost} onClick={back} disabled={step === 0}>
          {t.btn_back}
        </button>
        {step < STEPS.length - 1 ? (
          <button className="ex-btn-primary" style={S.btnPrimary} onClick={next}>
            {t.btn_continue}
          </button>
        ) : (
          <button className="ex-btn-primary" style={S.btnPrimary} onClick={submit}>
            {t.btn_submit}
          </button>
        )}
      </div>

      <button style={S.coachLink} onClick={() => setMode("coach")}>
        {t.btn_coachaccess}
      </button>

      <style>{`
        .ex-btn-primary:hover { filter: brightness(1.08); }
        .ex-btn-primary:active { filter: brightness(0.94); }
        .ex-btn-ghost:hover { background: ${T.color.surfaceRaised}; border-color: ${T.color.borderStrong}; }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
          outline: 2px solid ${T.color.accent};
          outline-offset: 1px;
        }
        * { box-sizing: border-box; }
        @media (max-width: 480px) {
          .ex-row { flex-direction: column !important; gap: 0 !important; }
          .ex-progress-label { display: none; }
          .ex-progress-row { gap: 2px; }
        }
      `}</style>
    </div>
  );
}

      )}

function computePrecedence(form) {
  const flags = [form.agreePhotos, form.agreeFinancial, form.agreeCode].filter(Boolean).length;
  const discipline = parseInt(form.disciplineRating, 10) || 0;
  if (flags === 3 && discipline >= 7) return "URGENT";
  if (flags >= 2 && discipline >= 5) return "PRIORITY";
  return "ROUTINE";
}

function precedenceLabel(t, code) {
  if (code === "URGENT") return t.prec_urgent;
  if (code === "PRIORITY") return t.prec_priority;
  return t.prec_routine;
}

function NineLineCard({ t, form }) {
  const precedence = computePrecedence(form);
  const precedenceColor = precedence === "URGENT" ? T.color.danger : precedence === "PRIORITY" ? T.color.accent : T.color.textSecondary;
  const commitmentList = [form.agreePhotos && t.flag_photos, form.agreeFinancial && t.flag_financial, form.agreeCode && t.flag_code].filter(Boolean);
  const equipmentLabel = t[form.equipment] || form.equipment;
  return (
    <div style={S.nineCard}>
      <div style={S.nineHeader}>
        <span style={S.nineHeaderTitle}>{t.nine_title}</span>
        <span style={{ ...S.nineBadge, borderColor: precedenceColor, color: precedenceColor }}>{precedenceLabel(t, precedence)}</span>
      </div>
      <NineLine n="1" tag="ID" label={t.nine_1_label} value={`${form.name || "—"} · ${form.email || t.nine_noemail}${form.phone ? " · " + form.phoneCountry + " " + form.phone : ""}`} />
      <NineLine n="2" tag="M" label={t.nine_2_label} value={form.whyNow || "—"} />
      <NineLine n="3" tag="I" label={t.nine_3_label} value={`${form.injuries || t.nine_nonereported}${form.failureResponse === "spiral" ? " · " + t.nine_spiral_suffix : ""}`} />
      <NineLine n="4" tag="S" label={t.nine_4_label} value={`${form.trainingAge || "—"} · ${form.disciplineRating}/10 · ${form.medicalClearance || t.nine_medical_unset}`} />
      <NineLine n="5" tag="RES" label={t.nine_5_label} value={equipmentLabel} />
      <NineLine n="6" tag="PRI" label={t.nine_6_label} value={`${precedenceLabel(t, precedence)} — ${form.daysPerWeek} ${t.days_suffix}/${t.week_word}, ${form.sessionLength} ${t.min_label}`} />
      <NineLine n="7" tag="T" label={t.nine_7_label} value={form.becoming || "—"} />
      <NineLine n="8" tag="SEC" label={t.nine_8_label} value={form.supportSystem || t.nine_notstated} />
      <NineLine n="9" tag="HAZ" label={t.nine_9_label} value={commitmentList.length ? commitmentList.join(", ") : t.nine_noflags} />
    </div>
  );
}

function NineLine({ n, tag, label, value }) {
  return (
    <div style={S.nineLine}>
      <div style={S.nineLineNum}>{n}</div>
      <div style={S.nineLineTag}>{tag}</div>
      <div style={{ flex: 1, minWidth: 0 }}>

}

function StepReview({ t, form }) {

    <div>
      <SectionTitle title={t.review_title} sub={t.review_sub} />
      <NineLineCard t={t} form={form} />
    </div>

function formatReportText(t, form) {
  const precedence = precedenceLabel(t, computePrecedence(form));
  const commitmentList = [form.agreePhotos && t.flag_photos, form.agreeFinancial && t.flag_financial, form.agreeCode && t.flag_code].filter(Boolean);
  const equipmentLabel = t[form.equipment] || form.equipment;
  return [
    t.report_header,
    `${t.report_precedence}: ${precedence}`,
    "",
    `1. ${t.report_line_id}: ${form.name || "-"} / ${form.email || t.nine_noemail}${form.phone ? " / " + form.phoneCountry + " " + form.phone : ""}`,
    `2. ${t.report_line_m}: ${form.whyNow || "-"}`,
    `3. ${t.report_line_i}: ${form.injuries || t.nine_nonereported}${form.failureResponse === "spiral" ? " -- " + t.nine_spiral_suffix : ""}`,
    `4. ${t.report_line_s}: ${form.trainingAge || "-"} / ${form.disciplineRating}/10 / ${form.medicalClearance || t.nine_medical_unset}`,
    `5. ${t.report_line_res}: ${equipmentLabel}`,
    `6. ${t.report_line_pri}: ${precedence} -- ${form.daysPerWeek} ${t.days_suffix}/${t.week_word}, ${form.sessionLength} ${t.min_label}`,
    `7. ${t.report_line_t}: ${form.becoming || "-"}`,
    `8. ${t.report_line_sec}: ${form.supportSystem || t.nine_notstated}`,
    `9. ${t.report_line_haz}: ${commitmentList.length ? commitmentList.join(", ") : t.nine_noflags}`,
  ].join("\n");
}

/* ---------- Confirmation ---------- */
function Confirmed({ lang, setLang, t, rtl, form, onRestart }) {
  const [copied, setCopied] = useState(false);
  const reportText = formatReportText(t, form);

  async function copyReport() {
    try {
      await navigator.clipboard.writeText(reportText);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      // clipboard unavailable — the mailto/WhatsApp buttons still work
    }
  }

  const emailHref = `mailto:?subject=${encodeURIComponent(t.email_subject_prefix + (form.name || t.new_applicant))}&body=${encodeURIComponent(reportText)}`;
  const whatsappHref = `https://wa.me/?text=${encodeURIComponent(reportText)}`;

  return (
    <div style={{ ...S.app, textAlign: "center", paddingTop: 60 }} dir={rtl ? "rtl" : "ltr"}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 12 }}>
        <LangSwitcher lang={lang} setLang={setLang} />
      </div>
      <img src={LOGO_SRC} alt="Extraction" style={{ ...S.logo, margin: "0 auto 20px" }} />
      <h1 style={{ ...S.wordmark, fontSize: 22, marginBottom: 6 }}>{t.confirmed_title}</h1>
      <p style={{ color: T.color.textSecondary, maxWidth: 420, margin: "0 auto 20px", lineHeight: 1.6 }}>
        {t.confirmed_body}
      </p>

      <div style={{ display: "flex", flexDirection: "column", gap: 8, maxWidth: 320, margin: "0 auto 24px" }}>
        <button className="ex-btn-primary" style={S.btnPrimary} onClick={copyReport}>
          {copied ? t.btn_copied : t.btn_copy}
        </button>
        <a href={emailHref} style={{ textDecoration: "none" }}>
          <button className="ex-btn-ghost" style={{ ...S.btnGhost, width: "100%" }}>{t.btn_email}</button>
        </a>
        <a href={whatsappHref} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}>
          <button className="ex-btn-ghost" style={{ ...S.btnGhost, width: "100%" }}>{t.btn_whatsapp}</button>
        </a>
      </div>

      <button className="ex-btn-ghost" style={S.btnGhost} onClick={onRestart}>
        {t.btn_submitanother}
      </button>
      <style>{`.ex-btn-ghost:hover { background: ${T.color.surfaceRaised}; }`}</style>
    </div>
  );
}

/* ---------- Coach view ---------- */
const PRECEDENCE_RANK = { URGENT: 0, PRIORITY: 1, ROUTINE: 2 };

function CoachView({ lang, setLang, t, rtl, submissions, loading, onBack, onRefresh }) {
  const [sortBy, setSortBy] = useState("precedence"); // "precedence" | "newest"

  const sorted = [...submissions].sort((a, b) => {
    if (sortBy === "precedence") {
      const ra = PRECEDENCE_RANK[computePrecedence(a)];
      const rb = PRECEDENCE_RANK[computePrecedence(b)];
      if (ra !== rb) return ra - rb;
      return a.submittedAt < b.submittedAt ? 1 : -1;
    }
    return a.submittedAt < b.submittedAt ? 1 : -1;
  });

  return (
    <div style={S.app} dir={rtl ? "rtl" : "ltr"}>
      <Header lang={lang} setLang={setLang} t={t} />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "20px 0", flexWrap: "wrap", gap: 10 }}>
        <div>
          <h1 style={{ ...S.wordmark, fontSize: 18 }}>{t.coach_title}</h1>
          <p style={{ color: T.color.textSecondary, fontSize: 12.5, marginTop: 4 }}>
            {t.coach_note}
          </p>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="ex-btn-ghost" style={S.btnGhost} onClick={onRefresh}>{t.btn_refresh}</button>
          <button className="ex-btn-ghost" style={S.btnGhost} onClick={onBack}>{t.btn_backtoform}</button>
        </div>
      </div>

      {submissions.length > 0 && (
        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          <button
            className={sortBy === "precedence" ? "ex-btn-primary" : "ex-btn-ghost"}
            style={sortBy === "precedence" ? S.btnPrimary : S.btnGhost}
            onClick={() => setSortBy("precedence")}
          >
            {t.btn_sortprecedence}
          </button>
          <button
            className={sortBy === "newest" ? "ex-btn-primary" : "ex-btn-ghost"}
            style={sortBy === "newest" ? S.btnPrimary : S.btnGhost}
            onClick={() => setSortBy("newest")}
          >
            {t.btn_sortnewest}
          </button>
        </div>
      )}

      {loading ? (
        <p style={{ color: T.color.textSecondary }}>{t.loading}</p>
      ) : submissions.length === 0 ? (
        <div style={S.card}>
          <p style={{ color: T.color.textSecondary, margin: 0 }}>{t.noreports}</p>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {sorted.map((s) => (
            <div key={s.id}>
              <div style={{ fontSize: 11.5, color: T.color.textMuted, marginBottom: 6 }}>
                {t.received_prefix} {new Date(s.submittedAt).toLocaleString()}
              </div>
              <NineLineCard t={t} form={s} />
            </div>
          ))}
        </div>
      )}
      <style>{`.ex-btn-ghost:hover { background: ${T.color.surfaceRaised}; }`}</style>
    </div>
  );
}
