<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Extraction — Operator Portal</title>
<link rel="icon" href="assets/extraction-mark.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<style>
  :root{
    --bg:#0C0C0A; --bg-raise:#17140F; --bg-card:#1B170F;
    --bone:#F5DFB8; --tan:#A6926F; --tan-dim:#7A6E56;
    --oxide:#C0451D; --oxide-dim:#7A2C12;
    --line:rgba(245,223,184,0.14); --line-strong:rgba(245,223,184,0.24);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--bone); font-family:'Inter',system-ui,sans-serif; line-height:1.6; }
  h1,h2,h3{ font-family:'Oswald',sans-serif; text-transform:uppercase; margin:0; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img{ width:36px; height:36px; }
  .brand .word{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.12em; font-size:0.95rem; }
  .brand .sub{ font-family:'IBM Plex Mono',monospace; font-size:0.6rem; color:var(--tan); text-transform:uppercase; letter-spacing:0.1em; }
  #app{ max-width:760px; margin:0 auto; padding:48px 20px 100px; }
  .center{ min-height:60vh; display:flex; align-items:center; justify-content:center; }
  .panel{ width:340px; max-width:90vw; }
  label{ font-family:'IBM Plex Mono',monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--tan); display:block; margin-bottom:6px; }
  input[type=email]{
    width:100%; background:var(--bg-raise); border:1px solid var(--line-strong); color:var(--bone);
    padding:11px 12px; border-radius:2px; font-family:'Inter',sans-serif; font-size:0.95rem;
  }
  input[type=email]:focus{ outline:none; border-color:var(--oxide); }
  button{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:0.85rem;
    background:var(--oxide); color:var(--bg); border:none; padding:12px 16px; border-radius:2px; cursor:pointer;
    width:100%; margin-top:14px;
  }
  button:hover{ background:var(--oxide-dim); }
  button.ghost{ background:transparent; border:1px solid var(--line-strong); color:var(--bone); width:auto; margin:0; padding:8px 14px; font-size:0.75rem; }
  button.ghost:hover{ background:var(--bg-raise); }
  .err{ color:var(--oxide); font-size:0.8rem; margin-top:8px; }
  .msg{ color:var(--tan); text-align:center; }
  p.sub{ color:var(--tan); font-size:0.95rem; margin-top:8px; }

  .manual-head{ border:1px solid var(--line-strong); background:var(--bg-raise); padding:24px; border-radius:2px; }
  .phase-pill{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--oxide); border:1px solid var(--oxide-dim); padding:4px 10px; border-radius:2px; margin-top:10px;
  }
  .manual-desc{ color:var(--tan); margin-top:12px; }

  .week{ margin-top:28px; }
  .week-label{ font-size:1.05rem; letter-spacing:0.02em; padding-bottom:10px; border-bottom:1px solid var(--line-strong); }
  .day{ margin-top:16px; }
  .day-label{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--tan-dim); margin-bottom:8px; }
  table{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--tan-dim); padding:6px 8px; border-bottom:1px solid var(--line-strong); }
  td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.notes{ color:var(--tan); font-size:0.82rem; }
  .video-link{ color:var(--oxide); text-decoration:none; font-family:'IBM Plex Mono',monospace; font-size:0.72rem; white-space:nowrap; }
  .video-link:hover{ text-decoration:underline; }
  .table-wrap{ overflow-x:auto; }

  .day-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .dco-btns{ display:flex; gap:6px; }
  .dco-btn{
    font-family:'IBM Plex Mono',monospace; font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em;
    background:transparent; border:1px solid var(--line-strong); color:var(--tan); padding:5px 10px; border-radius:2px;
    cursor:pointer; width:auto; margin:0;
  }
  .dco-btn:hover{ background:var(--bg-raise); }
  .dco-btn.active-dco{ background:var(--oxide); border-color:var(--oxide); color:var(--bg); }
  .dco-btn.active-dnco{ background:#3F2A22; border-color:#7A2C12; color:var(--bone); }

  .locked-phase{
    border:1px dashed var(--line-strong); border-radius:2px; padding:22px 20px; margin-top:28px;
    text-align:center; color:var(--tan);
  }
  .locked-phase .lock-icon{ font-size:1.3rem; margin-bottom:6px; }
  .locked-phase h3{ font-size:1rem; color:var(--bone); }
  .locked-phase p{ font-size:0.85rem; margin-top:6px; max-width:440px; margin-left:auto; margin-right:auto; }

  .debrief{ margin-top:22px; margin-bottom:36px; border:1px solid var(--line-strong); background:var(--bg-raise); border-radius:2px; padding:20px; }
  .debrief h3{ font-size:0.95rem; }
  .debrief-pill{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.08em;
    padding:3px 9px; border-radius:2px; margin-left:10px; border:1px solid var(--line-strong); color:var(--tan);
  }
  .debrief-pill.st-cleared{ color:var(--oxide); border-color:var(--oxide-dim); }
  .debrief-pill.st-needs_review{ color:#D9705A; border-color:#3F2A22; }
  .debrief-field{ margin-top:14px; }
  .debrief-field label{ margin-bottom:5px; }
  select.debrief-select, textarea.debrief-notes{
    width:100%; background:var(--bg); border:1px solid var(--line-strong); color:var(--bone);
    padding:9px 10px; border-radius:2px; font-family:'Inter',sans-serif; font-size:0.9rem;
  }
  textarea.debrief-notes{ min-height:64px; resize:vertical; font-family:'Inter',sans-serif; }
  .debrief-counts{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--tan-dim); margin-top:10px; }
  .debrief-note-msg{ font-size:0.85rem; color:var(--tan); margin-top:12px; }

  @media (max-width:520px){
    #app{ padding:32px 14px 80px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="assets/extraction-mark.png" alt="Extraction" />
    <div>
      <div class="word">Extraction</div>
      <div class="sub">Operator Portal</div>
    </div>
  </div>
  <div id="header-actions"></div>
</header>

<div id="app"><div class="center msg">Loading…</div></div>

<script>
const ytSearchUrl = (name) =>
  "https://www.youtube.com/results?search_query=" + encodeURIComponent(name + " exercise proper form tutorial");

const app = document.getElementById("app");
const headerActions = document.getElementById("header-actions");

// A week label looks like "Week 3 — Golden Hour" — the phase name is everything
// after the em dash. Kept identical to the same helper on the coach dashboard so
// the lock gate here and the debrief clearing there agree on what a "phase" is.
function phaseLabelOf(weekLabel) {
  if (!weekLabel) return "";
  const i = weekLabel.indexOf("—");
  return (i >= 0 ? weekLabel.slice(i + 1) : weekLabel).trim();
}
function phasesOfManual(manual) {
  const out = [];
  ((manual && manual.weeks) || []).forEach((w) => {
    const p = phaseLabelOf(w.label);
    if (p && !out.includes(p)) out.push(p);
  });
  return out;
}

// Field-note state for the signed-in operator: DCO/DNCO log keyed by day id,
// and their phase debrief history (newest first).
const CURRENT = { client: null, manual: null, logs: {}, debriefs: [] };

async function loadFieldNotes(clientId) {
  const [logsRes, debriefsRes] = await Promise.all([
    window.sb.from("session_logs").select("*").eq("client_id", clientId),
    window.sb.from("phase_debriefs").select("*").eq("client_id", clientId).order("submitted_at", { ascending: false }),
  ]);
  const logMap = {};
  (logsRes.data || []).forEach((l) => { logMap[l.day_id] = l; });
  CURRENT.logs = logMap;
  CURRENT.debriefs = debriefsRes.data || [];
}

function latestDebrief(phase) {
  return CURRENT.debriefs.find((d) => d.phase_label === phase) || null;
}

// The active week is the first one that isn't fully logged yet (every day in it
// has a DCO or DNCO field note) — once all of a week's days are checked off, the
// pill under the operator's name advances to the next week on its own.
function computeActiveWeekLabel(manual) {
  const weeks = (manual && manual.weeks) || [];
  for (const week of weeks) {
    const days = week.days || [];
    const complete = days.length > 0 && days.every((d) => !!CURRENT.logs[d.id]);
    if (!complete) return week.label;
  }
  return weeks.length ? `${weeks[weeks.length - 1].label} — Complete` : null;
}

function phaseDcoCounts(manual, phase) {
  let dco = 0, dnco = 0, total = 0;
  (manual.weeks || []).forEach((w) => {
    if (phaseLabelOf(w.label) !== phase) return;
    (w.days || []).forEach((d) => {
      total += 1;
      const log = CURRENT.logs[d.id];
      if (log) { if (log.status === "DCO") dco += 1; else dnco += 1; }
    });
  });
  return { dco, dnco, total };
}

// Single delegated listener survives every innerHTML re-render below.
app.addEventListener("click", async (e) => {
  const dcoBtn = e.target.closest("[data-dco]");
  if (dcoBtn) { await logSession(dcoBtn.dataset); return; }
  const submitBtn = e.target.closest(".submit-debrief");
  if (submitBtn) { await submitDebrief(submitBtn); return; }
});

async function logSession(ds) {
  if (!CURRENT.client) return;
  const payload = {
    client_id: CURRENT.client.id,
    week_id: ds.weekId,
    week_label: ds.weekLabel,
    day_id: ds.dayId,
    day_label: ds.dayLabel,
    status: ds.dco,
    logged_at: new Date().toISOString(),
  };
  try {
    const { data, error } = await window.sb
      .from("session_logs")
      .upsert(payload, { onConflict: "client_id,day_id" })
      .select()
      .single();
    if (error) throw error;
    CURRENT.logs[ds.dayId] = data;
    renderManual(CURRENT.client, CURRENT.manual);
  } catch (e) {
    // field note didn't save — leave the buttons as-is, next tap retries
  }
}

async function submitDebrief(btnEl) {
  const phase = btnEl.dataset.phase;
  const block = btnEl.closest(".debrief");
  const errEl = block.querySelector(".debrief-err");
  const val = (sel) => block.querySelector(`[data-field="${sel}"]`).value;
  const counts = phaseDcoCounts(CURRENT.manual, phase);
  if (errEl) errEl.textContent = "";
  try {
    const { data, error } = await window.sb
      .from("phase_debriefs")
      .insert({
        client_id: CURRENT.client.id,
        phase_label: phase,
        answers: {
          physical: val("physical"),
          mental: val("mental"),
          spiritual: val("spiritual"),
          notes: block.querySelector('[data-field="notes"]').value.trim(),
          dco: counts.dco,
          dnco: counts.dnco,
        },
      })
      .select()
      .single();
    if (error) throw error;
    CURRENT.debriefs.unshift(data);
    renderManual(CURRENT.client, CURRENT.manual);
  } catch (e) {
    if (errEl) errEl.textContent = "Couldn't submit — try again.";
  }
}

function renderDebriefBlock(client, manual, phase) {
  const existing = latestDebrief(phase);
  const counts = phaseDcoCounts(manual, phase);
  const showForm = !existing || existing.status === "needs_review";
  const pill = existing
    ? `<span class="debrief-pill st-${existing.status}">${
        existing.status === "cleared" ? "Cleared" : existing.status === "needs_review" ? "Needs follow-up" : "Pending review"
      }</span>`
    : "";
  let body;
  if (!showForm) {
    body = `<p class="debrief-note-msg">Submitted ${new Date(existing.submitted_at).toLocaleDateString()}. ${
      existing.status === "cleared"
        ? (client.tier === "1on1" ? "Cleared by the Commander — next phase is unlocked below." : "Logged. Keep going — the rest of the manual is already open.")
        : "Sent to the Commander for review."
    }</p>`;
  } else {
    body = `
      <div class="debrief-field">
        <label>Physical — how's the body?</label>
        <select class="debrief-select" data-field="physical">
          <option value="ready">Ready — no red flags</option>
          <option value="managing">Managing — some soreness/fatigue</option>
          <option value="not_ready">Not ready — pain, injury, or real fatigue</option>
        </select>
      </div>
      <div class="debrief-field">
        <label>Mental — how's the head?</label>
        <select class="debrief-select" data-field="mental">
          <option value="ready">Ready — locked in</option>
          <option value="managing">Managing — motivation's dipping</option>
          <option value="not_ready">Not ready — burnt out</option>
        </select>
      </div>
      <div class="debrief-field">
        <label>Spiritual — bigger picture check</label>
        <select class="debrief-select" data-field="spiritual">
          <option value="ready">Ready — mission still clear</option>
          <option value="managing">Managing — drifting a bit</option>
          <option value="not_ready">Not ready — losing the why</option>
        </select>
      </div>
      <div class="debrief-field">
        <label>Anything the Commander should know?</label>
        <textarea class="debrief-notes" data-field="notes" placeholder="Optional field note"></textarea>
      </div>
      <div class="debrief-counts">DCO ${counts.dco} / DNCO ${counts.dnco} logged this phase${counts.total ? ` · ${counts.total - counts.dco - counts.dnco} not yet logged` : ""}</div>
      <button class="submit-debrief" data-phase="${escapeHtml(phase)}">Submit phase debrief</button>
      <div class="err debrief-err"></div>`;
  }
  return `<div class="debrief"><h3>Phase Debrief — ${escapeHtml(phase)}${pill}</h3>${body}</div>`;
}

function lockedPhaseHtml(phase, prevPhase) {
  return `
    <div class="locked-phase">
      <div class="lock-icon">🔒</div>
      <h3>${escapeHtml(phase)} — Locked</h3>
      <p>${prevPhase ? `Submit your ${escapeHtml(prevPhase)} debrief above and your Commander will clear it to open this phase.` : "This phase opens once your Commander clears you into it."}</p>
    </div>`;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function renderLogin(prefillSent) {
  headerActions.innerHTML = "";
  app.innerHTML = `
    <div class="center">
      <div class="panel">
        <h1 style="font-size:22px;text-align:center;">Find Your Bearing</h1>
        <p class="sub" style="text-align:center;">Sign in with the email your coach has on file to see your assigned manual.</p>
        <div id="login-body" style="margin-top:20px;"></div>
      </div>
    </div>`;
  const body = document.getElementById("login-body");
  if (prefillSent) {
    body.innerHTML = `<p class="msg">Check your email for the sign-in link.</p>`;
    return;
  }
  body.innerHTML = `
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />
    <div id="login-err" class="err"></div>
    <button id="send-link">Send magic link</button>`;
  document.getElementById("send-link").addEventListener("click", sendMagicLink);
  document.getElementById("email").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMagicLink();
  });
}

async function sendMagicLink() {
  const email = document.getElementById("email").value.trim();
  const errEl = document.getElementById("login-err");
  errEl.textContent = "";
  if (!email) return;
  if (!window.sb) { errEl.textContent = "Backend not configured."; return; }
  const { error } = await window.sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.href.split("#")[0] },
  });
  if (error) { errEl.textContent = error.message; return; }
  renderLogin(true);
}

function renderSignOut(email) {
  headerActions.innerHTML = `<button class="ghost" id="sign-out">Sign out</button>`;
  document.getElementById("sign-out").addEventListener("click", async () => {
    if (window.sb) await window.sb.auth.signOut();
    location.reload();
  });
}

function renderNoManual() {
  app.innerHTML = `
    <div class="center">
      <div class="panel" style="width:400px;">
        <h1 style="font-size:20px;">No manual assigned yet</h1>
        <p class="sub">We don't have a manual linked to this email yet. If you just submitted your MAYDAY report, your coach hasn't assigned one yet — check Ops Freq (WhatsApp) if it's been a while.</p>
      </div>
    </div>`;
}

function renderManual(client, manual) {
  if (!manual) { renderNoManual(); return; }
  const phases = phasesOfManual(manual);
  const is1on1 = client.tier === "1on1";
  const unlockedPhase = is1on1 ? (client.unlocked_through_phase || phases[0]) : null;
  const unlockedIdx = unlockedPhase ? phases.indexOf(unlockedPhase) : -1;
  const activeWeekLabel = computeActiveWeekLabel(manual);

  let html = `
    <div class="manual-head">
      <div class="mono" style="font-size:0.65rem;color:var(--tan-dim);text-transform:uppercase;letter-spacing:0.08em;">Operator</div>
      <h1 style="font-size:1.6rem;margin-top:4px;">${escapeHtml(client.name)}</h1>
      ${activeWeekLabel ? `<div class="phase-pill">${escapeHtml(activeWeekLabel)}</div>` : ""}
      ${is1on1 ? `<div class="phase-pill" style="margin-left:8px;">1:1 On Target Coaching</div>` : ""}
      <h2 style="font-size:1.1rem;margin-top:18px;">${escapeHtml(manual.name)}</h2>
      ${manual.description ? `<p class="manual-desc">${escapeHtml(manual.description)}</p>` : ""}
    </div>`;

  let lastPhase = null;
  let lastPhaseLocked = false;
  let placeholderShownFor = null;

  (manual.weeks || []).forEach((week) => {
    const phase = phaseLabelOf(week.label);
    const phaseIdx = phases.indexOf(phase);
    const locked = is1on1 && phaseIdx > unlockedIdx;

    if (phase !== lastPhase) {
      if (lastPhase !== null && !lastPhaseLocked) {
        html += renderDebriefBlock(client, manual, lastPhase);
      }
      lastPhase = phase;
      lastPhaseLocked = locked;
    }

    if (locked) {
      if (placeholderShownFor !== phase) {
        html += lockedPhaseHtml(phase, phases[phaseIdx - 1]);
        placeholderShownFor = phase;
      }
      return;
    }

    html += `<div class="week"><div class="week-label">${escapeHtml(week.label)}</div>`;
    (week.days || []).forEach((day) => {
      const log = CURRENT.logs[day.id];
      html += `<div class="day">
        <div class="day-head">
          <div class="day-label">${escapeHtml(day.label)}</div>
          <div class="dco-btns">
            <button class="dco-btn${log && log.status === "DCO" ? " active-dco" : ""}" data-dco="DCO" data-week-id="${escapeHtml(week.id)}" data-week-label="${escapeHtml(week.label)}" data-day-id="${escapeHtml(day.id)}" data-day-label="${escapeHtml(day.label)}">DCO</button>
            <button class="dco-btn${log && log.status === "DNCO" ? " active-dnco" : ""}" data-dco="DNCO" data-week-id="${escapeHtml(week.id)}" data-week-label="${escapeHtml(week.label)}" data-day-id="${escapeHtml(day.id)}" data-day-label="${escapeHtml(day.label)}">DNCO</button>
          </div>
        </div>
        <div class="table-wrap"><table><thead><tr>
          <th>Exercise</th><th>Sets</th><th>Reps</th><th>Notes</th><th></th>
        </tr></thead><tbody>`;
      (day.exercises || []).forEach((ex) => {
        html += `<tr>
          <td>${escapeHtml(ex.name)}</td>
          <td>${escapeHtml(ex.sets)}</td>
          <td>${escapeHtml(ex.reps)}</td>
          <td class="notes">${escapeHtml(ex.notes)}</td>
          <td><a class="video-link" href="${ytSearchUrl(ex.name)}" target="_blank" rel="noopener noreferrer">▶ form</a></td>
        </tr>`;
      });
      html += `</tbody></table></div></div>`;
    });
    html += `</div>`;
  });

  if (lastPhase !== null && !lastPhaseLocked) {
    html += renderDebriefBlock(client, manual, lastPhase);
  }

  app.innerHTML = html;
}

async function boot() {
  if (!window.sb) {
    app.innerHTML = `<div class="center msg">Backend not configured.</div>`;
    return;
  }
  const { data } = await window.sb.auth.getSession();
  const session = data && data.session;
  if (!session) {
    renderLogin(false);
    return;
  }
  renderSignOut(session.user.email);
  app.innerHTML = `<div class="center msg">Finding your manual…</div>`;
  try {
    const { data: client, error } = await window.sb.rpc("claim_client");
    if (error) throw error;
    if (!client || !client.id) { renderNoManual(); return; }
    if (!client.manual_id) { renderNoManual(); return; }
    const { data: manual } = await window.sb.from("manuals").select("*").eq("id", client.manual_id).single();
    CURRENT.client = client;
    CURRENT.manual = manual;
    await loadFieldNotes(client.id);
    renderManual(client, manual);
  } catch (e) {
    renderNoManual();
  }
}

window.sb && window.sb.auth.onAuthStateChange((_event, _session) => {
  boot();
});

boot();
</script>
</body>
</html>
